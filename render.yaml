# The public server on Render (specs/deploy.md): one free web service, built from main.
# Create it once in the Render dashboard: New > Blueprint > this repository.
# No secret is written here: CT_SECRET is generated by Render and stays there.
services:
  - type: web
    name: campus-tycoon
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: uv sync --locked --no-dev --group deploy
    # one worker: the locks and the rate counter live in the process (specs/deploy-ready.md);
    # no control socket: not used, and it would need a writable home directory
    startCommand: uv run --no-sync gunicorn -w 1 --threads 8 --no-control-socket -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PORT
        value: "10000"
      - key: CT_PUBLIC
        value: "1"
      - key: CT_PROXY
        value: "1"
      - key: CT_SECRET
        generateValue: true
