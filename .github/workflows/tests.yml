name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id "pytest" is the required status check of the protected `main`
  # branch. Do not rename it without changing the branch protection rule.
  pytest:
    runs-on: ubuntu-latest
    # A throw-away Postgres for the checks of specs/persistent-runs.md (its password is not a secret:
    # the container lives only for this job). The game itself never reads TEST_DATABASE_URL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      # pinned to a commit SHA (specs/docs-refresh.md): a moved tag cannot change what runs here;
      # Dependabot proposes newer versions as PRs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests (tests/ and checks/)
        run: uv run pytest
