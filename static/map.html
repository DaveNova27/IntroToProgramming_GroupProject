<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Tycoon · 3D Map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥪</text></svg>">
  <link rel="stylesheet" href="/static/map.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="shell">
    <!-- the 3D campus is drawn here (WebGL canvas + labels) -->
    <div id="stage" aria-label="3D campus with your kiosk, storage shed and the road"></div>
    <div id="loading" class="loading">Building the campus…</div>

    <!-- ================= head-up display ================= -->
    <header class="hud-top">
      <div class="hud-brand">
        <span class="logo" aria-hidden="true">🥪</span>
        <div>
          <strong>Campus Tycoon</strong>
          <span class="hud-location">Carcavelos · Nova SBE</span>
          <nav class="views" aria-label="Views">
            <span aria-current="page">3D Map</span>
            <a href="/">Dashboard</a>
          </nav>
        </div>
      </div>
      <div class="hud-day">
        <ol id="day-pips" class="pips"></ol>
        <span id="day-label"></span>
      </div>
      <div class="hud-money">
        <span class="label">Cash</span>
        <strong id="hud-cash">—</strong>
        <span id="hud-gain" class="sub"></span>
      </div>
    </header>

    <!-- storage overview (left) and live sales ticker (right) -->
    <section id="hud-stock" class="hud-card hud-stock" aria-label="Stock per product"></section>
    <section id="ticker" class="hud-card ticker" aria-live="polite" hidden>
      <h3>Live sales · <span id="ticker-day"></span></h3>
      <div id="ticker-totals" class="ticker-totals"></div>
      <ol id="ticker-list" class="ticker-list"></ol>
    </section>

    <nav class="toolbar" aria-label="Actions">
      <button id="btn-order" class="tool" type="button" aria-label="Order stock"><span aria-hidden="true">🚚</span> <span class="txt">Order stock</span></button>
      <button id="btn-prices" class="tool" type="button" aria-label="Prices"><span aria-hidden="true">🏷️</span> <span class="txt">Prices</span></button>
      <button id="btn-open" class="tool primary" type="button"><span aria-hidden="true">🏪</span> <span id="open-label">Open</span></button>
      <button id="btn-fast" class="tool fast" type="button" hidden title="Finish the animation now"><span aria-hidden="true">⏩</span> <span class="txt">Skip</span></button>
      <button id="btn-camera" class="tool icon" type="button" title="Reset the camera" aria-label="Reset the camera">🎥</button>
    </nav>
    <p class="hint-camera">Drag to rotate · scroll or pinch to zoom · click the kiosk or the shed</p>

    <!-- side panel: order stock / prices -->
    <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button class="close" type="button" data-close aria-label="Close">✕</button>
      </div>
      <div id="panel-body"></div>
    </aside>

    <!-- end of day / end of run -->
    <div id="overlay" class="overlay" hidden>
      <div class="card-pop" role="dialog" aria-modal="true" id="overlay-card"></div>
    </div>
  </div>

  <dialog id="new-run-dialog" class="dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <h2 id="dialog-title">Start a new run?</h2>
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" autofocus>Cancel</button>
        <button class="btn danger" value="confirm">Start new run</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="/static/common.js"></script>
  <script type="module" src="/static/map.js"></script>
  <script>
    // the 3D library comes from a CDN: say so if it never arrives
    setTimeout(() => {
      const loading = document.getElementById("loading");
      if (!loading.hidden) loading.innerHTML = 'The 3D view needs an internet connection to load. <a href="/">Open the dashboard</a>';
    }, 10000);
  </script>
</body>
</html>
