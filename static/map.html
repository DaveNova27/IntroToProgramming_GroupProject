<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Tycoon · Campus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥪</text></svg>">
  <link rel="stylesheet" href="/static/map.css">
</head>
<body>
  <div class="shell">
    <!-- the 2.5D campus is drawn here (static/world/) -->
    <canvas id="world" aria-label="The campus: walk with W A S D or click on the ground"></canvas>
    <div id="loading" class="loading">Building the campus…</div>

    <!-- ================= head-up display ================= -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">CT</span>
        <span class="brand-text"><strong>Campus Tycoon</strong><small>CARCAVELOS · NOVA SBE</small></span>
      </div>
      <div class="stats" aria-label="Run status">
        <div class="stat"><span>DAY</span><strong id="stat-day">—</strong></div>
        <div class="stat stat-weather"><span>WEATHER</span><strong id="stat-weather">—</strong></div>
        <div class="stat stat-weather stat-outlook"><span>TOMORROW</span><strong id="stat-outlook">—</strong></div>
        <div class="stat stat-time"><span>TIME</span><strong id="stat-time">—</strong></div>
        <div class="stat stat-cash"><span>CASH</span><strong id="stat-cash">—</strong></div>
        <div class="stat stat-stock"><span>STOCK</span><strong id="stat-stock">—</strong></div>
        <div class="stat"><span>OVERALL</span><strong id="stat-gain">—</strong></div>
      </div>
      <button id="btn-new-run" class="outline-button" type="button">New run</button>
    </header>

    <div class="zone-banner">
      <span aria-hidden="true">◉</span>
      <div><small id="zone-sub"></small><strong id="zone-name"></strong></div>
    </div>
    <div class="zone-chips" aria-label="Areas of the campus">
      <span data-zone="campus">OUTSIDE</span>
      <span data-zone="mercado">MERCADO</span>
      <span data-zone="academy">ACADEMIC</span>
      <span data-zone="hub">STUDENT HUB</span>
    </div>

    <section id="hud-stock" class="hud-stock" aria-label="Stock per product"></section>

    <button id="interaction-hint" class="interaction-hint" type="button" hidden>
      <span class="keycap" aria-hidden="true">E</span>
      <span><small>INTERACT</small><strong id="interaction-name"></strong></span>
    </button>

    <nav class="toolbar" aria-label="Actions">
      <button id="btn-order" class="tool" type="button"><span class="ico" aria-hidden="true">▦</span><span class="txt">Stock</span></button>
      <button id="btn-prices" class="tool" type="button"><span class="ico" aria-hidden="true">€</span><span class="txt">Prices</span></button>
      <button id="btn-shops" class="tool" type="button"><span class="ico" aria-hidden="true">⌂</span><span class="txt">Shops</span></button>
      <button id="btn-shift" class="tool" type="button"><span class="ico" aria-hidden="true">☕</span><span class="txt">Play day</span></button>
      <button id="btn-open" class="tool primary" type="button"><span class="ico" aria-hidden="true">☀</span><span id="open-label">Open</span></button>
      <button id="btn-fast" class="tool" type="button" hidden title="Finish the day now"><span class="ico" aria-hidden="true">»</span><span class="txt">Skip</span></button>
      <button id="btn-dashboard" class="tool" type="button"><span class="ico" aria-hidden="true">▤</span><span class="txt">Dashboard</span></button>
    </nav>

    <!-- side panel: order stock / prices / shops -->
    <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button class="close" type="button" data-close aria-label="Close">✕</button>
      </div>
      <div id="panel-body"></div>
    </aside>

    <!-- end of day / end of run -->
    <div id="overlay" class="overlay" hidden>
      <div class="card-pop" role="dialog" aria-modal="true" id="overlay-card"></div>
    </div>
  </div>

  <dialog id="new-run-dialog" class="dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <h2 id="dialog-title">Start a new run?</h2>
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" autofocus>Cancel</button>
        <button class="btn danger" value="confirm">Start new run</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="/static/common.js"></script>
  <script type="module" src="/static/world/main.js"></script>
</body>
</html>
