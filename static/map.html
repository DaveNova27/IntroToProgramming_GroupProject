<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Tycoon · Campus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥪</text></svg>">
  <link rel="stylesheet" href="/static/map.css">
  <link rel="stylesheet" href="/static/badges.css">
</head>
<body>
  <div class="shell">
    <!-- the 2.5D campus is drawn here (static/world/) -->
    <canvas id="world" aria-label="The campus: walk with W A S D or click on the ground"></canvas>
    <div id="loading" class="loading">Building the campus…</div>

    <!-- ================= head-up display ================= -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">CT</span>
        <span class="brand-text"><strong>Campus Tycoon</strong><small>CARCAVELOS · NOVA SBE</small></span>
      </div>
      <div class="stats" aria-label="Run status">
        <div class="stat"><span>DAY</span><strong id="stat-day">—</strong></div>
        <div class="stat stat-weather"><span id="stat-weather-label">WEATHER</span><strong id="stat-weather">—</strong></div>
        <div class="stat stat-event" hidden><span>EVENT</span><strong id="stat-event">—</strong></div>
        <div class="stat stat-weather stat-outlook"><span>TOMORROW</span><strong id="stat-outlook">—</strong></div>
        <div class="stat stat-time"><span>TIME</span><strong id="stat-time">—</strong></div>
        <div class="stat stat-cash"><span>CASH</span><strong id="stat-cash">—</strong></div>
        <div class="stat stat-stock"><span>STOCK</span><strong id="stat-stock">—</strong></div>
        <div class="stat"><span>OVERALL</span><strong id="stat-gain">—</strong></div>
      </div>
      <button id="btn-demo" class="outline-button" type="button" title="The prepared days of the live demo">Demo</button>
      <button id="btn-new-run" class="outline-button" type="button">New run</button>
    </header>

    <div class="zone-banner">
      <span aria-hidden="true">◉</span>
      <div><small id="zone-sub"></small><strong id="zone-name"></strong></div>
    </div>
    <div class="zone-chips" aria-label="Areas of the campus">
      <span data-place="outside">OUTSIDE</span>
      <span data-place="nova">NOVA</span>
    </div>

    <section id="hud-stock-card" class="hud-stock" aria-label="Stock per product">
      <button id="stock-toggle" class="stock-toggle" type="button" aria-expanded="true" aria-controls="hud-stock" aria-label="Stock" title="Hide the stock">
        <span class="stock-title">Stock</span><span class="chev" aria-hidden="true">&#9662;</span>
      </button>
      <div id="hud-stock"></div>
    </section>

    <button id="interaction-hint" class="interaction-hint" type="button" hidden>
      <span class="keycap" aria-hidden="true">E</span>
      <span><small>INTERACT</small><strong id="interaction-name"></strong></span>
    </button>

    <!-- the evening (spec day-cycle): the day is over, the report waits in the Dorm -->
    <div id="evening-hint" class="evening-hint" role="status" hidden>
      <span class="moon" aria-hidden="true">☾</span>
      <span id="evening-text"></span>
      <button id="btn-go-home" class="btn" type="button">Go home</button>
      <button id="btn-skip-walk" class="btn skip" type="button" title="Straight to bed, without the walk">Skip the walk</button>
    </div>

    <nav class="toolbar" aria-label="Actions">
      <button id="btn-order" class="tool" type="button"><span class="ico" aria-hidden="true">▦</span><span class="txt">Stock</span></button>
      <button id="btn-prices" class="tool" type="button"><span class="ico" aria-hidden="true">€</span><span class="txt">Prices</span></button>
      <button id="btn-shops" class="tool" type="button"><span class="ico" aria-hidden="true">⌂</span><span class="txt">Shops</span></button>
      <button id="btn-shift" class="tool" type="button"><span class="ico" aria-hidden="true">☕</span><span class="txt">Shift</span></button>
      <button id="btn-open" class="tool primary" type="button"><span class="ico" aria-hidden="true">☀</span><span id="open-label">Open</span></button>
      <button id="btn-editor" class="tool" type="button" hidden title="Editor mode (CT_EDITOR=1)"><span class="ico" aria-hidden="true">✎</span><span class="txt">Editor</span></button>
      <button id="btn-dashboard" class="tool" type="button"><span class="ico" aria-hidden="true">▤</span><span class="txt">Dashboard</span></button>
    </nav>

    <!-- side panel: order stock / prices / shops -->
    <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button class="close" type="button" data-close aria-label="Close">✕</button>
      </div>
      <div id="panel-body"></div>
    </aside>

    <!-- the demo (specs/demo-scenarios.md): the card of the running scenario; texts from the server -->
    <aside id="demo-card" class="demo-card" hidden aria-labelledby="demo-title" aria-live="polite">
      <p class="demo-step"><span>DEMO</span> <strong id="demo-step"></strong></p>
      <h2 id="demo-title"></h2>
      <p id="demo-text" class="demo-text"></p>
      <p class="demo-goal"><span id="demo-check" class="demo-check" aria-hidden="true">○</span><span id="demo-goal"></span></p>
      <div class="demo-actions">
        <button id="demo-hide" class="btn ghost" type="button">Got it</button>
        <button id="demo-next" class="btn" type="button">Skip scenario</button>
        <button id="demo-free" class="btn ghost" type="button">End demo</button>
      </div>
    </aside>

    <!-- the night between two days: black for a moment while the player sleeps -->
    <div id="night-fade" class="night-fade" aria-hidden="true"></div>

    <!-- a badge was earned (specs/badges.md): a card at the top left that leaves by itself -->
    <div id="badge-pop" class="badge-toast-area" aria-live="polite" hidden></div>

    <!-- end of day / end of run -->
    <div id="overlay" class="overlay" hidden>
      <div class="card-pop" role="dialog" aria-modal="true" id="overlay-card"></div>
    </div>
  </div>

  <dialog id="new-run-dialog" class="dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <h2 id="dialog-title">Start a new run?</h2>
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" autofocus>Cancel</button>
        <button class="btn danger" value="confirm">Start new run</button>
      </div>
    </form>
  </dialog>

  <dialog id="end-day-dialog" class="dialog" aria-labelledby="end-day-title">
    <form method="dialog">
      <h2 id="end-day-title">End the day now?</h2>
      <p id="end-day-text"></p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" autofocus>Keep playing</button>
        <button class="btn danger" value="confirm">End the day</button>
      </div>
    </form>
  </dialog>

  <dialog id="demo-dialog" class="dialog" aria-labelledby="demo-dialog-title">
    <form method="dialog">
      <h2 id="demo-dialog-title">Start the demo?</h2>
      <p id="demo-dialog-text"></p>
      <label class="demo-pick">Start with
        <select id="demo-pick"></select>
      </label>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" autofocus>Cancel</button>
        <button class="btn danger" value="confirm">Start demo</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="/static/common.js"></script>
  <script type="module" src="/static/world/main.js"></script>
</body>
</html>
