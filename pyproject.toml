[project]
name = "campus-tycoon"
version = "0.1.0"
description = "A 30-day campus snack-stand simulation (Nova SBE, Introduction to Programming)"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    # the runs of the public server in Postgres (specs/persistent-runs.md); used only with DATABASE_URL
    "psycopg[binary]>=3.3,<3.4",
    "psycopg-pool>=3.3,<3.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# the production server on the host (specs/deploy.md); not installed by default
deploy = ["gunicorn>=26.2,<27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "checks"]
